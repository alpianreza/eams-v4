name: Bootstrap Frontend Dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/frontend-dependencies.yml

permissions:
  contents: write
  issues: write

jobs:
  lock-frontend-dependencies:
    name: Lock Livewire 4 + Tailwind CSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and commit lockfiles
        id: resolve
        shell: bash
        run: |
          set -o pipefail
          {
            echo '### Composer: Livewire 4'
            composer require 'livewire/livewire:^4.0' --with-all-dependencies --no-interaction --no-progress
            composer show livewire/livewire --locked

            echo '### npm: Tailwind CSS 4 + Vite plugin'
            npm install --save-dev --save-exact 'tailwindcss@^4.1' '@tailwindcss/vite@^4.1' --no-audit --no-fund
            npm ls tailwindcss @tailwindcss/vite

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add composer.json composer.lock package.json package-lock.json

            if git diff --cached --quiet; then
              echo 'Dependency manifests and lockfiles already up to date.'
            else
              git commit -m 'build: lock Livewire 4 and Tailwind CSS'
              git push origin HEAD:main
            fi
          } 2>&1 | tee frontend-bootstrap.log

      - name: Publish dependency bootstrap status
        if: always()
        shell: bash
        run: |
          {
            echo '## Frontend Dependency Bootstrap'
            echo
            echo "**$(date -u +'%Y-%m-%d %H:%M UTC') · source commit \`${GITHUB_SHA:0:8}\` · run #$GITHUB_RUN_ID · status: ${{ job.status }}**"
            echo
            echo '```'
            tail -n 80 frontend-bootstrap.log 2>/dev/null || echo 'Dependency step did not produce a log.'
            echo '```'
          } > frontend-bootstrap-summary.md
          gh issue edit 2 --body-file frontend-bootstrap-summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
