name: Tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  tests:
    name: PHP 8.2 + Livewire 4 + Tailwind — Laravel 12
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Build + verify (capture all output)
        run: |
          set +e
          exec > ci-output.txt 2>&1

          echo "### composer install"
          composer install --prefer-dist --no-interaction --no-progress
          COMPOSER_EXIT=$?
          if [ $COMPOSER_EXIT -ne 0 ]; then
            echo "### RESULT: composer install exit = $COMPOSER_EXIT"
            exit $COMPOSER_EXIT
          fi

          echo "### npm ci"
          npm ci --no-audit --no-fund
          NPM_EXIT=$?
          if [ $NPM_EXIT -ne 0 ]; then
            echo "### RESULT: npm ci exit = $NPM_EXIT"
            exit $NPM_EXIT
          fi

          echo "### vite build"
          npm run build
          VITE_EXIT=$?
          if [ $VITE_EXIT -ne 0 ]; then
            echo "### RESULT: vite build exit = $VITE_EXIT"
            exit $VITE_EXIT
          fi

          echo "### prepare (sqlite)"
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=eams|DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite|" .env
          mkdir -p database bootstrap/cache storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          touch database/database.sqlite
          php artisan key:generate

          echo "### about"; php artisan about
          echo "### migrate"; php artisan migrate --force
          echo "### test"; php artisan test; TEST_EXIT=$?
          echo "### RESULT: artisan test exit = $TEST_EXIT"
          exit $TEST_EXIT

      - name: Update CI Status issue body with concise result
        if: always()
        run: |
          {
            echo "## CI Status — latest run";
            echo "";
            echo "**$(date -u +'%Y-%m-%d %H:%M UTC') · commit \`${GITHUB_SHA:0:8}\` · run #$GITHUB_RUN_ID**";
            echo "";
            echo '```';
            tail -n 90 ci-output.txt;
            echo '```';
          } > ci-summary.md
          gh issue edit 2 --body-file ci-summary.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
