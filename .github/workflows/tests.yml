name: Tests

on:
  push:
    branches: [main, milestone-1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  env:
    name: diag 1 — php & composer version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none
      - run: php -v
      - run: composer --version

  validate:
    name: diag 2 — composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - run: composer validate --no-check-lock

  resolve:
    name: diag 3 — composer update (no scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none
      - run: composer update --no-scripts --no-interaction --no-progress --prefer-dist

  artisan:
    name: diag 4 — artisan boot + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan about
      - run: php artisan route:list
      - run: php artisan test
