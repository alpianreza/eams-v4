name: Tests

on:
  push:
    branches: [main, milestone-1]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: PHP 8.5 — Laravel 13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare application (sqlite for verification)
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i "s|^DB_DATABASE=eams|DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite|" .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Verify + test (capture output)
        run: |
          {
            echo "=== php artisan about ==="; php artisan about
            echo "=== php artisan route:list ==="; php artisan route:list
            echo "=== php artisan migrate ==="; php artisan migrate --force
            echo "=== php artisan migrate:status ==="; php artisan migrate:status
            echo "=== php artisan test ==="; php artisan test
          } 2>&1 | tee ci-output.txt

      - name: Post output to PR on failure
        if: failure() && github.event_name == 'pull_request'
        run: gh pr comment "$PR_NUMBER" --body-file ci-output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
