name: Tests

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  tests:
    name: PHP 8.5 — Laravel 13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Build + verify (capture all output)
        run: |
          set +e
          exec > ci-output.txt 2>&1
          echo "### php -v"; php -v
          echo "### ensure dirs"; mkdir -p database bootstrap/cache storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          echo "### composer validate"; composer validate --no-check-lock
          echo "### composer update"; composer update --prefer-dist --no-interaction --no-progress
          echo "### prepare (sqlite)"; cp .env.example .env; sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env; sed -i "s|^DB_DATABASE=eams|DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite|" .env; touch database/database.sqlite; php artisan key:generate
          echo "### about"; php artisan about
          echo "### route:list"; php artisan route:list
          echo "### migrate"; php artisan migrate --force
          echo "### migrate:status"; php artisan migrate:status
          echo "### test"; php artisan test; TEST_EXIT=$?
          echo "### RESULT: artisan test exit = $TEST_EXIT"
          exit $TEST_EXIT

      - name: Post result to CI Status issue
        if: always()
        run: gh issue comment 2 --body-file ci-output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
