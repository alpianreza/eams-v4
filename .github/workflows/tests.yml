name: Tests

on:
  push:
    branches: [main, milestone-1]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: PHP 8.5 — Laravel 13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Build + verify (capture everything, always report)
        run: |
          set +e
          exec > ci-output.txt 2>&1
          echo "### php -v"; php -v; echo "exit=$?"
          echo "### ensure writable dirs"; mkdir -p database bootstrap/cache storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs; echo "exit=$?"
          echo "### composer validate"; composer validate --no-check-lock; echo "exit=$?"
          echo "### composer update"; composer update --prefer-dist --no-interaction --no-progress; echo "exit=$?"
          echo "### prepare .env (sqlite)"; cp .env.example .env; sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env; sed -i "s|^DB_DATABASE=eams|DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite|" .env; touch database/database.sqlite; php artisan key:generate; echo "exit=$?"
          echo "### about"; php artisan about; echo "exit=$?"
          echo "### route:list"; php artisan route:list; echo "exit=$?"
          echo "### migrate"; php artisan migrate --force; echo "exit=$?"
          echo "### migrate:status"; php artisan migrate:status; echo "exit=$?"
          echo "### test"; php artisan test; echo "exit=$?"
          exit 0

      - name: Post output to PR
        if: always() && github.event_name == 'pull_request'
        run: gh pr comment "$PR_NUMBER" --body-file ci-output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
