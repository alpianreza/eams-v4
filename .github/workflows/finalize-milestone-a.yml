name: Finalize Milestone A Metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock browser QA dependency and patch architecture
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact @playwright/test --no-audit --no-fund
          python <<'PY'
          from pathlib import Path

          path = Path('docs/20-laravel-architecture.md')
          text = path.read_text()
          first_divider = text.index('\n---\n')
          text = '''# 20 — EAMS Laravel Architecture

> **Status:** IMPLEMENTED — Laravel 12 modular monolith aktif dan dimigrasikan bertahap dari CI4 dengan business behavior tetap kompatibel.
> **Runtime:** PHP `^8.2`, MySQL 8, Blade, Livewire 4, Tailwind CSS 4, Alpine.js, dan Vite 6.
> **Dasar mengikat:** Business Specification (`docs/17`) + Human Decisions (`docs/19`) + Production DB Evidence (`docs/18`, `docs/03`).
> **Batas:** jangan mengubah business rule, kontrak API/storage/QR, atau backend teruji hanya untuk kebutuhan frontend.
''' + text[first_divider:]

          def replace_section(source, heading, next_heading, replacement):
              start = source.index(heading)
              end = source.index(next_heading)
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          text = replace_section(text, '## 2. Laravel Version', '## 3. PHP Version', '''## 2. Laravel Version

- **Implemented:** Laravel **12.x**, dikunci di `composer.lock` dan kompatibel dengan PHP `^8.2`.
- Livewire **4.x** digunakan untuk stateful UI dan navigasi SPA-like tanpa mengubah aplikasi menjadi SPA penuh.
- Versi dependency aktual harus berasal dari Composer/npm lockfile, bukan ditulis manual.''')

          text = replace_section(text, '## 23. Frontend Architecture', '## 24. API/AJAX Architecture', '''## 23. Frontend Architecture

- **Target final:** Blade + Livewire 4 + Tailwind CSS 4 + Alpine.js + Vite.
- `wire:navigate` digunakan pada link GET internal aman; file, download, export, PDF, dan form submit mempertahankan behavior yang sesuai.
- Alpine berasal dari bundle Livewire agar runtime tunggal. JavaScript biasa tetap digunakan untuk camera, QR scanner, MediaDevices, canvas, chart, dan file preview.
- Tailwind memakai prefix `eams:` tanpa Preflight selama coexistence. Bootstrap 5 tetap dibundel untuk halaman legacy dan baru dihapus setelah replacement lengkap serta regression QA hijau.
- Application shell mencakup topbar, sidebar fixed/collapsible, drawer mobile, breadcrumb, notifications, user menu, theme, toast, dan navigation loading state.
- Reusable primitives berada di `resources/views/components/ui`; semantic status dipusatkan di `App\\Support\\Ui\\StatusPresentation`.
- Detail token, component catalog, migration status, QA gate, dan known issues ada di `docs/21-ui-ux-design-system.md`.''')

          marker = '\n---\n\n## Traceability\n'
          if '## Phase 2B — Frontend Migration Status' not in text:
              addition = '''
---

## Phase 2B — Frontend Migration Status

- **Milestone A implemented:** Livewire 4, Tailwind 4, Vite, design tokens, application shell, sidebar, topbar, breadcrumb, `wire:navigate`, dan reusable components.
- **Migration strategy:** bertahap; Bootstrap legacy tetap aktif dan dilindungi regression test.
- **Completed components:** Button, Input, Textarea, Select, Checkbox, Radio, Switch, Badge, Card, Table, Modal, Drawer, Toast, Alert, Dropdown, Tabs, Breadcrumb, Pagination, Skeleton, Empty State, Confirm Dialog, File Upload, Image Preview, Status Indicator.
- **Remaining Bootstrap:** halaman modul yang belum dimigrasikan per milestone.
- **Known issues:** hardening validasi upload Inventory masih pending; business-specific browser API tidak boleh direwrite sembarangan.
- **Next milestone:** Dashboard, tanpa mengubah KPI calculation dan canonical period engine.
'''
              text = text.replace(marker, addition + marker)

          text = text.replace('> **Status:** DRAFT — menunggu **Architecture Review** oleh Project Owner. Implementasi Laravel **belum** boleh dimulai.\n> **Rantai:** Legacy → Audit → Production Verification → Human Decision → Business Specification → **Architecture Design (dokumen ini)** → Architecture Review → Implementation.', '> **Status:** IMPLEMENTED dan dimigrasikan bertahap. Perubahan frontend tetap tunduk pada business specification dan human decisions.\n> **Rantai:** Legacy → Audit → Production Verification → Human Decision → Business Specification → Architecture → Implementation → Automated QA → Deployment.')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json docs/20-laravel-architecture.md
          git commit -m 'build(qa): lock Playwright and refresh architecture status'
          git pull --rebase origin main
          git push origin HEAD:main
